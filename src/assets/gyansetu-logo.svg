<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">GyanSetu logo</title>
  <desc id="desc">Stacked Gyan Setu wordmark inspired by the provided website name logo.</desc>
  <rect width="512" height="512" rx="42" fill="#050505"/>
  <g transform="translate(66 157)" fill="#050505" stroke="#ffffff" stroke-width="1.6" paint-order="stroke fill" font-family="Inter, Arial Black, Arial, sans-serif" font-weight="900" letter-spacing="-12">
    <text x="0" y="86" font-size="92">Gyan</text>
    <text x="24" y="165" font-size="92">Setu.</text>
  </g>
</svg>
